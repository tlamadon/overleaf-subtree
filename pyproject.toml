[project]
name = "overleaf-subtree"
version = "0.1.0"
description = "Mirror a subdirectory of a git repo onto an Overleaf project root, with a review gate before publishing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olsub = "overleaf_subtree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overleaf_subtree"]
